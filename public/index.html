<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>SIGURE</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>


<body>

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <main
    id="loginView"
    class="login-shell"
  >

    <section class="login-card">

      <div class="brand-mark">
        S
      </div>


      <div class="brand-block">

        <h1>
          SIGURE
        </h1>

        <p class="brand-subtitle">
          Sistema Integral de Gestión de Unidades de Respuesta a Emergencias
        </p>

        <p class="institution">
          Área de Calidad y Seguridad del Paciente
        </p>

      </div>


      <form
        id="loginForm"
        class="form-stack"
      >

        <label>

          Usuario

          <input
            id="loginUser"
            type="text"
            autocomplete="username"
            required
          >

        </label>


        <label>

          Contraseña

          <div class="password-wrap">

            <input
              id="loginPass"
              type="password"
              autocomplete="current-password"
              required
            >

            <button
              id="togglePassword"
              class="icon-button"
              type="button"
            >
              Ver
            </button>

          </div>

        </label>


        <button
          id="loginButton"
          class="button primary full"
          type="submit"
        >
          Ingresar a SIGURE
        </button>

      </form>


      <div
        id="loginMessage"
        class="message hidden"
      ></div>


      <div class="login-footer">
        Acceso institucional controlado
      </div>

    </section>

  </main>


  <!-- =====================================================
       APLICACIÓN
       ===================================================== -->

  <div
    id="appView"
    class="app-shell hidden"
  >


    <!-- ===================================================
         MENÚ LATERAL
         =================================================== -->

    <aside class="sidebar">

      <div class="sidebar-brand">

        <div class="brand-mark small">
          S
        </div>


        <div>

          <strong>
            SIGURE
          </strong>

          <span id="sidebarRole">
            Sistema
          </span>

        </div>

      </div>


      <!-- =================================================
           NAVEGACIÓN
           ================================================= -->

      <nav
        id="nav"
        class="nav-list"
      >

        <button
          data-view="dashboard"
          class="nav-item active"
          type="button"
        >
          Panel
        </button>


        <button
          data-view="units"
          class="nav-item"
          type="button"
        >
          Unidades
        </button>


        <button
          data-view="alerts"
          class="nav-item"
          type="button"
        >
          Alertas
        </button>


        <button
          data-view="feedback"
          class="nav-item"
          type="button"
        >
          Auditorías / Feedback
        </button>


        <button
          data-view="admin"
          class="nav-item admin-only hidden"
          type="button"
        >
          Administración
        </button>

      </nav>


      <!-- =================================================
           SESIÓN
           ================================================= -->

      <div class="sidebar-bottom">

        <div class="session-box">

          <span id="sessionName">
            Usuario
          </span>

          <small id="sessionService"></small>

        </div>


        <button
          id="logoutButton"
          class="button secondary full"
          type="button"
        >
          Cerrar sesión
        </button>

      </div>

    </aside>


    <!-- ===================================================
         CONTENIDO PRINCIPAL
         =================================================== -->

    <section class="main-area">


      <!-- =================================================
           CABECERA
           ================================================= -->

      <header class="topbar">

        <button
          id="mobileMenuButton"
          class="mobile-menu"
          type="button"
          aria-label="Abrir menú"
        >
          ☰
        </button>


        <div>

          <h2 id="viewTitle">
            Panel
          </h2>

          <p id="viewSubtitle">
            Vista de SIGURE
          </p>

        </div>


        <button
          id="refreshButton"
          class="button secondary"
          type="button"
        >
          Actualizar
        </button>

      </header>


      <!-- =================================================
           CONTENEDOR DINÁMICO
           ================================================= -->

      <div
        id="content"
        class="content"
      >

        <div class="loading-card">
          Cargando SIGURE...
        </div>

      </div>

    </section>

  </div>


  <!-- =====================================================
       MODAL GLOBAL
       ===================================================== -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div
      class="modal-backdrop"
      data-close-modal="true"
    ></div>


    <div class="modal-card">

      <button
        id="modalClose"
        class="modal-close"
        type="button"
        aria-label="Cerrar"
      >
        ×
      </button>


      <div id="modalBody"></div>

    </div>

  </div>


  <!-- =====================================================
       NOTIFICACIONES
       ===================================================== -->

  <div
    id="toast"
    class="toast-container"
  ></div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->


  <!-- =====================================================
       1. NÚCLEO ACTUAL DE SIGURE
       =====================================================

       app.js continúa siendo temporalmente el núcleo
       principal de la aplicación.

       Actualmente contiene:
         - state
         - $
         - $$
         - esc
         - asBool
         - showToast
         - openModal
         - closeModal
         - apiCall
         - renderView
         - openUnit
         - autenticación
         - dashboard
         - unidades
         - administración
         - resto de la aplicación

       Por este motivo debe cargarse primero.
       ===================================================== -->

  <script src="/app.js"></script>


  <!-- =====================================================
       2. SHEETJS
       =====================================================

       Librería local para lectura de archivos de planillas.

       Permitirá procesar:
         - .xlsx
         - .xls
         - .csv

       La librería se encuentra almacenada dentro del
       propio proyecto:

       /public/js/vendor/xlsx.full.min.js

       No modifica datos por sí misma.
       Únicamente permite interpretar los archivos
       seleccionados por el usuario.
       ===================================================== -->

  <script src="/js/vendor/xlsx.full.min.js"></script>


  <!-- =====================================================
       3. MÓDULO DE STOCK
       =====================================================

       stock.js se carga después de app.js y SheetJS.

       Esto permite que el módulo utilice:

         - state
         - apiCall()
         - openModal()
         - closeModal()
         - showToast()
         - renderView()
         - openUnit()

       y también:

         - XLSX

       para importar archivos Excel.

       Este módulo será responsable de:

         - consulta de stock
         - carga manual masiva
         - importación Excel
         - importación CSV
         - lotes
         - vencimientos
         - validación previa
         - llamada a bulkAddStock
       ===================================================== -->

  <script src="/js/stock.js"></script>


  <!-- =====================================================
       API.JS - TODAVÍA NO ACTIVAR
       =====================================================

       El archivo:

       /public/js/api.js

       ya existe.

       Sin embargo NO debe cargarse todavía porque
       apiCall() continúa definido dentro de app.js.

       Si cargáramos ambos en esta etapa podríamos generar
       una declaración duplicada.

       En una etapa posterior:

         1. eliminaremos apiCall() de app.js
         2. activaremos api.js
         3. cambiaremos el orden a:

            /js/api.js
            /app.js
            /js/vendor/xlsx.full.min.js
            /js/stock.js

       ===================================================== -->


</body>

</html>

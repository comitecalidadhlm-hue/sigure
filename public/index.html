<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>SIGURE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="loginView" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">S</div>
      <div class="brand-block">
        <h1>SIGURE</h1>
        <p class="brand-subtitle">Sistema Integral de Gestión de Unidades de Respuesta a Emergencias</p>
        <p class="institution">Área de Calidad y Seguridad del Paciente</p>
      </div>

      <form id="loginForm" class="form-stack">
        <label>
          Usuario
          <input id="loginUser" type="text" autocomplete="username" required>
        </label>

        <label>
          Contraseña
          <div class="password-wrap">
            <input id="loginPass" type="password" autocomplete="current-password" required>
            <button id="togglePassword" class="icon-button" type="button">Ver</button>
          </div>
        </label>

        <button id="loginButton" class="button primary full" type="submit">
          Ingresar a SIGURE
        </button>
      </form>

      <div id="loginMessage" class="message hidden"></div>
      <div class="login-footer">Acceso institucional controlado</div>
    </section>
  </main>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">S</div>
        <div>
          <strong>SIGURE</strong>
          <span id="sidebarRole">Sistema</span>
        </div>
      </div>

      <nav id="nav" class="nav-list">
        <button data-view="dashboard" class="nav-item active">Panel</button>
        <button data-view="units" class="nav-item">Unidades</button>
        <button data-view="alerts" class="nav-item">Alertas</button>
        <button data-view="feedback" class="nav-item">Auditorías / Feedback</button>
        <button data-view="admin" class="nav-item admin-only hidden">Administración</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="session-box">
          <span id="sessionName">Usuario</span>
          <small id="sessionService"></small>
        </div>
        <button id="logoutButton" class="button secondary full">Cerrar sesión</button>
      </div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <button id="mobileMenuButton" class="mobile-menu" type="button">☰</button>
        <div>
          <h2 id="viewTitle">Panel</h2>
          <p id="viewSubtitle">Vista de SIGURE</p>
        </div>
        <button id="refreshButton" class="button secondary">Actualizar</button>
      </header>

      <div id="content" class="content">
        <div class="loading-card">Cargando SIGURE...</div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
